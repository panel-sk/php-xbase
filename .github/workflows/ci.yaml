name: tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: php-actions/composer@v6
      - name: PHPStan
        uses: chindit/actions-phpstan@master
        with:
          arguments: 'src/'

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [7.1, 7.2, 7.3, 7.4, 8.0]
        dependencies: [highest]
        include:
          - php-version: 7.1
            dependencies: lowest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          ini-values: zend.assertions=1

      - name: Install dependencies with Composer
        uses: ramsey/composer-install@v2
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Token nájdeš v nastaveniach Codecov.io
          files: ./clover.xml
          flags: php-${{ matrix.php-version }}
          fail_ci_if_error: true

      - name: Upload clover artifact for Coveralls
        uses: actions/upload-artifact@v4
        with:
          name: clover-${{ matrix.php-version }}-${{ matrix.dependencies }}
          path: clover.xml

  coveralls-upload:
    name: Upload coverage to Coveralls
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          coverage: none

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/logs

      - name: Install php-coveralls
        run: composer global require php-coveralls/php-coveralls

      -
